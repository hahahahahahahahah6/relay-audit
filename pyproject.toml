[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit"
version = "0.1.0"
description = "Offline auditing of synthetic or user-supplied relay transaction logs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
relay-audit = "relay_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
